name: Android build
on:
  push:
    branches: [anniversaire-2026]
    paths: ['android-surprise/**', '.github/workflows/android-surprise.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-surprise
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and test
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android-surprise/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
