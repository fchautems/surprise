name: Android build
on:
  push:
    branches: [anniversaire-2026]
    paths: ['android-surprise/**', '.github/workflows/android-surprise.yml', '!android-surprise/PROJECT_STATE.md']
  workflow_dispatch:
concurrency:
  group: android-surprise-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-surprise
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test content integrity
        run: python3 tests/test_bank.py
      - name: Test scoring logic
        run: |
          mkdir -p /tmp/surprise-test
          javac -d /tmp/surprise-test app/src/main/java/ch/fred/surprise/QuizRules.java tests/QuizRulesTest.java
          java -cp /tmp/surprise-test ch.fred.surprise.QuizRulesTest
      - name: Test synthesized notes
        run: |
          mkdir -p /tmp/surprise-sound-test
          javac -d /tmp/surprise-sound-test app/src/main/java/ch/fred/surprise/SoundWave.java tests/SoundWaveTest.java
          java -cp /tmp/surprise-sound-test ch.fred.surprise.SoundWaveTest
      - name: Compile and test
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android-surprise/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on Android emulator
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: |
            adb install android-surprise/app/build/outputs/apk/debug/app-debug.apk
            python3 android-surprise/tests/emulator_smoke.py
      - name: Save emulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-review-screens
          path: android-surprise/test-screens/*.png
          if-no-files-found: ignore
          retention-days: 7
  modern:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: android-surprise/app/build/outputs/apk/debug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on Android 15 emulator
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb install android-surprise/app/build/outputs/apk/debug/app-debug.apk
            python3 android-surprise/tests/emulator_smoke.py || { adb logcat -d -s AndroidRuntime:E ActivityTaskManager:I; exit 1; }
      - name: Save emulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-35-private-review
          path: android-surprise/test-screens/*.png
          if-no-files-found: ignore
          retention-days: 7
  memory:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: android-surprise/app/build/outputs/apk/debug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test memory game
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          script: |
            adb install android-surprise/app/build/outputs/apk/debug/app-debug.apk
            python3 android-surprise/tests/memory_smoke.py || { adb logcat -d -s AndroidRuntime:E; exit 1; }
  music:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: android-surprise/app/build/outputs/apk/debug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test music game
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          script: |
            adb install android-surprise/app/build/outputs/apk/debug/app-debug.apk
            python3 android-surprise/tests/music_smoke.py || { adb logcat -d -s AndroidRuntime:E; exit 1; }
